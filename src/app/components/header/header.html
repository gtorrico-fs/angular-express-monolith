<header class="main-header">
  <div class="header-container">
    <div class="brand-section">
      <div class="brand-logo">
        <mat-icon>layers</mat-icon>
      </div>
      <div class="brand-text">
        <div class="title-row">
          <h1 class="brand-title">Angular Monolith Engine</h1>
          <span class="badge info">
            <mat-icon>dns</mat-icon> Puerto 3000
          </span>
        </div>
        <p class="brand-subtitle">Arquitectura Monolítica Desplegable: Angular SSR + Express REST API (JSON Server)</p>
      </div>
    </div>

    <div class="header-right">
      @if (systemInfo(); as sys) {
        <div class="status-indicator">
          <span class="status-dot online"></span>
          <div class="status-info">
            <span class="status-label">Estado del Monolito</span>
            <span class="status-value">{{ sys.status }} ({{ sys.totalApiCalls }} Peticiones)</span>
          </div>
        </div>
      } @else {
        <div class="status-indicator">
          <span class="status-dot warning"></span>
          <span class="status-label">Conectando a Express...</span>
        </div>
      }
    </div>
  </div>

  <nav class="nav-bar">
    <button
      class="nav-item"
      [class.active]="activeTab() === 'dashboard'"
      (click)="selectTab('dashboard')"
    >
      <mat-icon>dashboard</mat-icon>
      <span>Dashboard General</span>
    </button>

    <button
      class="nav-item"
      [class.active]="activeTab() === 'tasks'"
      (click)="selectTab('tasks')"
    >
      <mat-icon>assignment</mat-icon>
      <span>Gestor de Tareas</span>
    </button>

    <button
      class="nav-item"
      [class.active]="activeTab() === 'products'"
      (click)="selectTab('products')"
    >
      <mat-icon>inventory_2</mat-icon>
      <span>Inventario REST</span>
    </button>

    <button
      class="nav-item"
      [class.active]="activeTab() === 'architecture'"
      (click)="selectTab('architecture')"
    >
      <mat-icon>schema</mat-icon>
      <span>Diagrama & API Tester</span>
    </button>

    <button
      class="nav-item"
      [class.active]="activeTab() === 'patterns'"
      (click)="selectTab('patterns')"
    >
      <mat-icon>integration_instructions</mat-icon>
      <span>Patrones de Diseño</span>
    </button>
  </nav>
</header>
